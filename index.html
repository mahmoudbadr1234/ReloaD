  <script src="https://cdnjs.cloudflare.com/ajax/libs/tooltipster/4.2.8/js/tooltipster.bundle.min.js"></script>

  <script>
    const translations = {
      en: {
        name: 'ReloaD',
        bio: 'Content Creator - Streamer',
        'twitch-tooltip': 'Watch my live streams on Twitch',
        'kick-tooltip': 'Watch my live streams on Kick',
        'facebook-tooltip': 'Follow me on Facebook',
        'instagram-tooltip': 'Follow me on Instagram',
        'tiktok-tooltip': 'Follow me on TikTok',
        'youtube-tooltip': 'Subscribe to my YouTube channel',
        'discord-tooltip': 'Join my Discord server',
        'whatsapp-tooltip': 'Join my WhatsApp channel',
        'donation-tooltip': 'Support me',
        rights: 'All rights reserved',
        developed: 'Developed by'
      },
      ar: {
        name: 'كريم',
        bio: 'صانع محتوى - ستريمر',
        'twitch-tooltip': 'شاهد بثوثي المباشرة على تويش',
        'kick-tooltip': 'شاهد بثوثي المباشرة على كيك',
        'facebook-tooltip': 'تابعني على الفيسبوك',
        'instagram-tooltip': 'تابعني على الإنستجرام',
        'tiktok-tooltip': 'تابعني على التيك توك',
        'youtube-tooltip': 'اشترك في قناة اليوتيوب',
        'discord-tooltip': 'انضم إلى سيرفر الديسكورد',
        'whatsapp-tooltip': 'انضم إلى قناة الواتساب',
        'donation-tooltip': 'ادعمني ',
        rights: 'جميع الحقوق محفوظة',
        developed: 'تم التطوير بواسطة'
      }
    };

    let currentLang = localStorage.getItem('language') || 'en';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('language', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      const langToggle = document.getElementById('toggle-language');
      if (lang === 'ar') {
        langToggle.classList.add('active');
      } else {
        langToggle.classList.remove('active');
      }

      document.querySelectorAll('[data-lang]').forEach(elem => {
        const key = elem.getAttribute('data-lang');
        if (translations[lang][key]) {
          elem.textContent = translations[lang][key];
        }
      });

      document.querySelectorAll('[data-lang-title]').forEach(elem => {
        const key = elem.getAttribute('data-lang-title');
        if (translations[lang][key]) {
          if ($(elem).hasClass('tooltipstered')) {
            $(elem).tooltipster('destroy');
          }
          elem.setAttribute('title', translations[lang][key]);
        }
      });
    }

    document.getElementById('toggle-language').addEventListener('click', () => {
      const newLang = currentLang === 'en' ? 'ar' : 'en';
      setLanguage(newLang);
    });

    setLanguage(currentLang);

    $('body').on('mouseenter', '*[title]', function () {
      $(this).tooltipster({
        animation: 'grow',
        animationDuration: 300,
        delay: 100,
        speed: 350,
        theme: 'tooltipster-punk',
        contentAsHTML: true,
        interactive: true,
        debug: false,
        maxWidth: 500
      }).tooltipster('show');
    });

  </script>
